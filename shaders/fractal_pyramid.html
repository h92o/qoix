<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fractal pyramid (from shadertoy.com/view/tsXBzS)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(10,12,20,0.72); color: #dfe7ff;
    padding: 12px 14px; border-radius: 10px; font-size: 12px;
    backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.08);
    width: 220px; user-select: none;
  }
  #panel h1 { font-size: 12px; margin: 0 0 8px; letter-spacing: .5px; opacity: .8; font-weight: 600; }
  #panel a { color: #76b6ff; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 7px 0; gap: 8px; }
  .row label { flex: 0 0 78px; opacity: .85; }
  .row input[type=range] { flex: 1; }
  .row input[type=color] { flex: 0 0 36px; height: 22px; padding: 0; border: none; background: none; }
  .row .val { flex: 0 0 34px; text-align: right; font-variant-numeric: tabular-nums; opacity: .7; }
  #toggle { position: fixed; top: 12px; left: 12px; z-index: 11; display: none;
    background: rgba(10,12,20,0.72); color: #dfe7ff; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="toggle">☰ controls</button>
<div id="panel">
  <h1>FRACTAL PYRAMID · <a href="https://www.shadertoy.com/view/tsXBzS" target="_blank" rel="noopener">original on Shadertoy</a></h1>
  <div class="row"><label>Fold count</label><input id="folds" type="range" min="1" max="16" step="1" value="8"><span class="val" id="folds_v">8</span></div>
  <div class="row"><label>Orbit speed</label><input id="orbit" type="range" min="0" max="3" step="0.01" value="1"><span class="val" id="orbit_v">1.0</span></div>
  <div class="row"><label>Fold spin</label><input id="spin" type="range" min="0" max="1" step="0.01" value="0.2"><span class="val" id="spin_v">0.2</span></div>
  <div class="row"><label>Color spread</label><input id="spread" type="range" min="0" max="0.4" step="0.005" value="0.1"><span class="val" id="spread_v">0.10</span></div>
  <div class="row"><label>Glow</label><input id="glow" type="range" min="100" max="900" step="10" value="400"><span class="val" id="glow_v">400</span></div>
  <div class="row"><label>Color A</label><input id="colA" type="color" value="#33b3e6"></div>
  <div class="row"><label>Color B</label><input id="colB" type="color" value="#ff00ff"></div>
  <div class="row"><label>Hue cycle</label><input id="hue" type="range" min="0" max="1" step="0.01" value="0"><span class="val" id="hue_v">0.0</span></div>
  <div class="row" style="margin-top:10px;"><button id="reset" style="flex:1;cursor:pointer;background:#1b2540;color:#dfe7ff;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:5px;">reset</button><button id="hide" style="flex:1;cursor:pointer;background:#1b2540;color:#dfe7ff;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:5px;margin-left:6px;">hide</button></div>
</div>
<script>
// Standalone WebGL host for the "fractal pyramid" shader.
// Shader copied from https://www.shadertoy.com/view/tsXBzS (see original author there).
// Provides the Shadertoy-style uniforms (iResolution, iTime) plus extra control
// uniforms wired to the slider/color UI above, so parameters can be tweaked live.

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl");
if (!gl) { document.body.innerHTML = "WebGL not supported"; throw new Error("no webgl"); }

const VERT = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// MAX_FOLDS is the compile-time loop bound (WebGL1 needs a constant); the live
// "fold count" slider feeds uFolds and we break early once i >= uFolds.
const FRAG = `
precision highp float;
#define MAX_FOLDS 16
uniform vec2  iResolution;
uniform float iTime;
uniform int   uFolds;     // active fold iterations (1..MAX_FOLDS)
uniform float uOrbit;     // camera orbit speed
uniform float uSpin;      // per-fold rotation speed
uniform float uSpread;    // palette scale (color variation across the shape)
uniform float uGlow;      // glow denominator (lower = brighter halo)
uniform vec3  uColA;      // palette endpoint A
uniform vec3  uColB;      // palette endpoint B
uniform float uHue;       // animated hue rotation amount

// rotate a hue by 'a' turns (cheap approximate hue shift in RGB).
vec3 hueShift(vec3 c, float a){
    const vec3 k = vec3(0.57735);            // normalized (1,1,1)
    float ca = cos(a), sa = sin(a);
    return c * ca + cross(k, c) * sa + k * dot(k, c) * (1.0 - ca);
}

vec3 palette(float d){
    vec3 col = mix(uColA, uColB, d);
    if(uHue > 0.0) col = hueShift(col, (uHue * iTime) * 6.2831853);
    return col;
}

vec2 rotate(vec2 p, float a){
    float c = cos(a);
    float s = sin(a);
    return p * mat2(c, s, -s, c);
}

float map(vec3 p){
    for(int i = 0; i < MAX_FOLDS; ++i){
        if(i >= uFolds) break;
        float t = iTime * uSpin;
        p.xz = rotate(p.xz, t);
        p.xy = rotate(p.xy, t * 1.89);
        p.xz = abs(p.xz);
        p.xz -= 0.5;
    }
    return dot(sign(p), p) / 5.0;
}

vec4 rm(vec3 ro, vec3 rd){
    float t = 0.0;
    vec3 col = vec3(0.0);
    float d = 0.0;
    for(float i = 0.0; i < 64.0; i++){
        vec3 p = ro + rd * t;
        d = map(p) * 0.5;
        if(d < 0.02) break;
        if(d > 100.0) break;
        col += palette(length(p) * uSpread) / (uGlow * d);
        t += d;
    }
    return vec4(col, 1.0 / (d * 100.0));
}

void mainImage(out vec4 fragColor, in vec2 fragCoord){
    vec2 uv = (fragCoord - (iResolution.xy / 2.0)) / iResolution.x;
    vec3 ro = vec3(0.0, 0.0, -50.0);
    ro.xz = rotate(ro.xz, iTime * uOrbit);
    vec3 cf = normalize(-ro);
    vec3 cs = normalize(cross(cf, vec3(0.0, 1.0, 0.0)));
    vec3 cu = normalize(cross(cf, cs));
    vec3 uuv = ro + cf * 3.0 + uv.x * cs + uv.y * cu;
    vec3 rd = normalize(uuv - ro);
    fragColor = rm(ro, rd);
}

void main(){
    vec4 col;
    mainImage(col, gl_FragCoord.xy);
    gl_FragColor = col;
}
`;

function compile(type, src){
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = name => gl.getUniformLocation(prog, name);
const uRes = U("iResolution"), uTime = U("iTime"), uFolds = U("uFolds"),
      uOrbit = U("uOrbit"), uSpin = U("uSpin"), uSpread = U("uSpread"),
      uGlow = U("uGlow"), uColA = U("uColA"), uColB = U("uColB"), uHue = U("uHue");

// "#rrggbb" -> [r,g,b] in 0..1
const hex2rgb = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];

// UI wiring
const ctrl = id => document.getElementById(id);
const els = {
    folds: ctrl("folds"), orbit: ctrl("orbit"), spin: ctrl("spin"),
    spread: ctrl("spread"), glow: ctrl("glow"), colA: ctrl("colA"),
    colB: ctrl("colB"), hue: ctrl("hue")
};
const defaults = { folds:8, orbit:1, spin:0.2, spread:0.1, glow:400, colA:"#33b3e6", colB:"#ff00ff", hue:0 };

function syncLabels(){
    ctrl("folds_v").textContent  = els.folds.value;
    ctrl("orbit_v").textContent  = (+els.orbit.value).toFixed(1);
    ctrl("spin_v").textContent   = (+els.spin.value).toFixed(2);
    ctrl("spread_v").textContent = (+els.spread.value).toFixed(2);
    ctrl("glow_v").textContent   = els.glow.value;
    ctrl("hue_v").textContent    = (+els.hue.value).toFixed(1);
}
Object.values(els).forEach(e => e.addEventListener("input", syncLabels));
syncLabels();

ctrl("reset").addEventListener("click", () => {
    for (const k in defaults) els[k].value = defaults[k];
    syncLabels();
});
const panel = ctrl("panel"), toggle = ctrl("toggle");
function showPanel(show){ panel.style.display = show ? "block" : "none"; toggle.style.display = show ? "none" : "block"; }
ctrl("hide").addEventListener("click", () => showPanel(false));
toggle.addEventListener("click", () => showPanel(true));

function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener("resize", resize);
resize();

const start = performance.now();
function frame(now){
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, (now - start) / 1000.0);
    gl.uniform1i(uFolds, parseInt(els.folds.value, 10));
    gl.uniform1f(uOrbit, +els.orbit.value);
    gl.uniform1f(uSpin, +els.spin.value);
    gl.uniform1f(uSpread, +els.spread.value);
    gl.uniform1f(uGlow, +els.glow.value);
    gl.uniform3fv(uColA, hex2rgb(els.colA.value));
    gl.uniform3fv(uColB, hex2rgb(els.colB.value));
    gl.uniform1f(uHue, +els.hue.value);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
