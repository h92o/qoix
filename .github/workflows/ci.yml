name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Chromium for the browser test
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Browser tests
        run: npx --yes --package=playwright@1.56.1 -- node test/browser.js

      - name: Standalone build is up to date
        run: |
          npm run standalone
          if ! git diff --quiet -- qoix-standalone.html; then
            echo "::error::qoix-standalone.html is stale — run 'npm run standalone' and commit the result."
            git diff --stat -- qoix-standalone.html
            exit 1
          fi
