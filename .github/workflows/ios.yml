name: QOIX Draw (iOS)

# Compiles the iPhone drawing app and runs its unit tests on a macOS runner.
# Only runs when the app (or this workflow) changes, so the synth is unaffected.
on:
  push:
    paths:
      - 'QoixDraw/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'QoixDraw/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: ''            # the image's default (Xcode 26.x)
          - runner: macos-15
            xcode: '16.4'        # the oldest Xcode the README promises
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        if: matrix.xcode != ''
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          swift --version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/udid.txt"
          import json, re, subprocess, sys
          sdk_major = int(subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"]).decode().split(".")[0])
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          best = None
          for runtime, devices in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              if ver[0] > sdk_major:
                  continue  # a newer runtime than the selected Xcode can drive
              for d in devices:
                  if not d.get("isAvailable", True) or not d["name"].startswith("iPhone"):
                      continue
                  score = (ver, 1 if re.fullmatch(r"iPhone \d+", d["name"]) else 0, d["name"])
                  if best is None or score > best[0]:
                      best = (score, d["udid"], d["name"], runtime)
          if best is None:
              sys.exit("no iPhone simulator available")
          print(best[1])
          print("using %s (%s)" % (best[2], best[3]), file=sys.stderr)
          PY
          echo "udid=$(cat "$RUNNER_TEMP/udid.txt")" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator and pre-approve Photos for the app
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcrun simctl privacy "${{ steps.sim.outputs.udid }}" grant photos-add app.qoix.draw || true

      - name: Build and run unit + UI tests (simulator)
        run: |
          set -o pipefail
          mkdir -p /tmp/qoixdraw-shots
          xcodebuild test \
            -project QoixDraw/QoixDraw.xcodeproj \
            -scheme QoixDraw \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Results.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/attachments"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Results.xcresult" --output-path "$RUNNER_TEMP/attachments" || true
          ls -la /tmp/qoixdraw-shots "$RUNNER_TEMP/attachments" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ matrix.runner }}
          path: |
            /tmp/qoixdraw-shots
            ${{ runner.temp }}/attachments
          if-no-files-found: warn
          retention-days: 14

      - name: App logs from the simulator
        if: always()
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --style compact --info --debug --last 30m \
            --predicate 'subsystem == "app.qoix.draw"' 2>&1 | tail -n 60 || true

      - name: Build for a real iPhone (Release, unsigned)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project QoixDraw/QoixDraw.xcodeproj \
            -scheme QoixDraw \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataDevice" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-device.log" | tail -n 5

      # An .ipa without a signature. It can't be installed as it is: a sideloading tool (AltStore, Sideloadly,
      # or Xcode's Devices window) signs it with your own Apple ID and puts it on your iPhone.
      - name: Package the unsigned .ipa
        if: ${{ !cancelled() && matrix.runner == 'macos-26' }}
        run: |
          app="$RUNNER_TEMP/DerivedDataDevice/Build/Products/Release-iphoneos/QoixDraw.app"
          if [ -d "$app" ]; then
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
            (cd "$RUNNER_TEMP/ipa" && zip -qry QoixDraw-unsigned.ipa Payload)
            ls -la "$RUNNER_TEMP/ipa"
          else
            echo "no device build to package"
          fi

      - name: Upload the unsigned .ipa
        if: ${{ !cancelled() && matrix.runner == 'macos-26' }}
        uses: actions/upload-artifact@v5
        with:
          name: QoixDraw-unsigned-ipa
          path: ${{ runner.temp }}/ipa/QoixDraw-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Built Info.plist
        if: always()
        run: |
          plist="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/QoixDraw.app/Info.plist"
          [ -f "$plist" ] && plutil -p "$plist" || echo "no Info.plist built"

      - name: Errors and test summary
        if: always()
        run: |
          for log in "$RUNNER_TEMP/xcodebuild-test.log" "$RUNNER_TEMP/xcodebuild-device.log"; do
            [ -f "$log" ] || continue
            echo "=============== $(basename "$log")"
            echo "--- errors"
            grep -E "error:|\*\* (BUILD|TEST) (FAILED|SUCCEEDED)" "$log" | sort -u | head -n 80 || true
            echo "--- failing tests"
            grep -E "Test Case .* failed|: error: -\[" "$log" | head -n 60 || true
            echo "--- warnings"
            grep -E "warning:" "$log" | sort -u | head -n 60 || true
            echo "--- test totals"
            grep -E "Executed [0-9]+ tests?" "$log" | tail -n 3 || true
          done
